<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FERS Retirement Calculator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>FERS Retirement Calculator</h1>
            <p>Plan your federal retirement with confidence.</p>
        </header>

        <main>
            <form id="calcForm">
                <section class="card">
                    <h2>Personal Details</h2>
                    <div class="grid">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" value="Federal Employee">
                        </div>
                        <div class="form-group">
                            <label for="birthDate">Birth Date</label>
                            <input type="date" id="birthDate" name="birthDate" required>
                        </div>
                        <div class="form-group">
                            <label for="hireDate">Hire Date</label>
                            <input type="date" id="hireDate" name="hireDate" required>
                        </div>
                        <div class="form-group">
                            <label for="salary">Current Salary ($)</label>
                            <input type="number" id="salary" name="salary" value="100000">
                        </div>
                        <div class="form-group">
                            <label for="high3">High-3 Salary ($)</label>
                            <input type="number" id="high3" name="high3" value="98000">
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>TSP & Savings</h2>
                    <div class="grid">
                        <div class="form-group">
                            <label for="tspTrad">Traditional TSP Balance ($)</label>
                            <input type="number" id="tspTrad" name="tspTrad" value="250000">
                        </div>
                        <div class="form-group">
                            <label for="tspRoth">Roth TSP Balance ($)</label>
                            <input type="number" id="tspRoth" name="tspRoth" value="50000">
                        </div>
                        <div class="form-group">
                            <label for="tspContrib">Contribution (%)</label>
                            <input type="number" id="tspContrib" name="tspContrib" value="5" step="0.1">
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Global Assumptions</h2>
                    <div class="grid">
                        <div class="form-group">
                            <label for="state">State of Residence</label>
                            <select id="state" name="state">
                                <option value="Pennsylvania">Pennsylvania</option>
                                <option value="New Jersey">New Jersey</option>
                                <option value="California">California</option>
                                <option value="Texas">Texas</option>
                                <option value="Florida">Florida</option>
                                <option value="New York">New York</option>
                                <option value="Virginia">Virginia</option>
                                <option value="Maryland">Maryland</option>
                                <option value="District of Columbia">District of Columbia</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Social Security</h2>
                    <div class="grid">
                        <div class="form-group">
                            <label for="ssAge">Start Age</label>
                            <select id="ssAge" name="ssAge">
                                <option value="62">62 (Early)</option>
                                <option value="65">65</option>
                                <option value="67" selected>67 (Full Retirement Age)</option>
                                <option value="70">70 (Delayed)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="ssEstimate">Est. Benefit at FRA ($/mo)</label>
                            <input type="number" id="ssEstimate" name="ssEstimate" value="2500">
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>TSP Strategy</h2>
                    <div class="grid">
                        <div class="form-group">
                            <label for="tspStrategy">Withdrawal Strategy</label>
                            <select id="tspStrategy" name="tspStrategy">
                                <option value="4_percent_rule">4% Rule</option>
                                <option value="fixed_annuity">Fixed Annuity</option>
                                <option value="variable_percentage">Variable Percentage (4%)</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Retirement Scenario</h2>
                    <div class="grid">
                        <div class="form-group">
                            <label for="retireDate">Retirement Date</label>
                            <input type="date" id="retireDate" name="retireDate" required>
                        </div>
                    </div>
                </section>

                <div class="actions">
                    <button type="submit" class="btn-primary">Calculate</button>
                </div>
            </form>

            <div id="results" class="hidden">
                <h2>Results</h2>
                <div id="resultsContent"></div>
            </div>
        </main>
    </div>
    <script src="/static/app.js"></script>
</body>

</html>
